<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVENORA</title>
  <!--
    GitHub Pages SPA fallback — AVENORA
    ====================================
    GitHub Pages serves this file for any path it cannot find as a static file.
    AVENORA uses hash-based routing (#hub, #social, #channel, etc.), so most
    direct URL accesses hit the root index.html correctly. The only time this
    page is needed is if someone bookmarks or shares a URL without a hash
    (e.g. /AVENORA12/ with some trailing path from an old history-based URL).

    The redirect below navigates to the app root at /AVENORA12/ and preserves
    any path segment as a hash so the SPA router can restore the page.

    REDIRECT LOGIC:
      Input:  https://legend200711.github.io/AVENORA12/some/path?q=1#fragment
      Output: https://legend200711.github.io/AVENORA12/#some/path
              (query string and extra fragments are dropped — SPA uses hash only)

    This page must NOT redirect to itself (that would be an infinite loop).
    The guard: only redirect if the current path is not the exact app root.
  -->
  <script>
    (function () {
      var loc = window.location;
      // The repo/app root on GitHub Pages
      var APP_ROOT = '/AVENORA12/';

      // If we are already at the root (with or without index.html), do nothing —
      // the 404 is for a static file that genuinely doesn't exist.
      if (loc.pathname === APP_ROOT ||
          loc.pathname === APP_ROOT + 'index.html') {
        return;
      }

      // Extract the sub-path relative to the app root.
      // e.g. /AVENORA12/channel → 'channel'
      var subPath = loc.pathname.slice(APP_ROOT.length).replace(/^\/+|\/+$/g, '');

      // Build the redirect URL: app root + hash=subPath (if any)
      // This lets the SPA router pick up #channel and render the channel page.
      var newUrl = loc.origin + APP_ROOT;
      if (subPath) {
        newUrl += '#' + subPath;
      } else if (loc.hash) {
        newUrl += loc.hash;
      }

      // Use replace so we don't pollute browser history with the 404 entry
      loc.replace(newUrl);
    })();
  </script>
</head>
<body style="background:#090807;color:#f0e8d8;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px">
  <div>
    <div style="font-family:'Arial Black',sans-serif;font-size:2rem;font-weight:900;letter-spacing:0.14em;background:linear-gradient(135deg,#ffd060,#f0e8d8,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px">AVENORA</div>
    <div style="font-size:0.7rem;letter-spacing:0.28em;color:rgba(201,168,76,0.6);text-transform:uppercase;margin-bottom:32px">A PLACE WHERE EVERYONE BELONGS</div>
    <p style="color:#8a8090;margin-bottom:24px">Redirecting to AVENORA…</p>
    <a href="/AVENORA12/" style="color:#c9a84c;text-decoration:underline;font-size:0.9rem">Click here if not redirected</a>
  </div>
</body>
</html>
