name: Deploy AVENORA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GitHub Pages deployment via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do NOT cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure Pages ─────────────────────────────────────────────────
      # enablement: true  → auto-enables GitHub Pages with source=Actions
      # if it has never been enabled for this repository.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ── 3. Ensure .nojekyll is present ─────────────────────────────────────
      # Prevents GitHub's Jekyll processor from transforming files or
      # ignoring any path that starts with an underscore.
      - name: Add .nojekyll and verify deployment
        run: |
          touch frontend/.nojekyll
          echo "--- frontend/ contents ---"
          ls -la frontend/
          echo "--- frontend/src/styles/ contents ---"
          ls -la frontend/src/styles/
          echo "--- Key file checks ---"
          echo "index.html present: $(test -f frontend/index.html && echo YES || echo NO)"
          echo "sw.js present:      $(test -f frontend/sw.js && echo YES || echo NO)"
          echo "404.html present:   $(test -f frontend/404.html && echo YES || echo NO)"
          echo "manifest.json:      $(test -f frontend/manifest.json && echo YES || echo NO)"
          echo "--- SW version check ---"
          grep "const SW_VERSION" frontend/sw.js || echo "SW_VERSION not found"
          grep "const CACHE_NAME" frontend/sw.js || echo "CACHE_NAME not found"

      # ── 4. Upload artifact ─────────────────────────────────────────────────
      # Packages frontend/ (the real AVENORA app) as the Pages artifact.
      # No build step required — this is a vanilla JS SPA.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      # ── 5. Deploy ──────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
