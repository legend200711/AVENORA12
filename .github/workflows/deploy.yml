name: Deploy AVENORA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for GitHub Pages deployment via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do NOT cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure Pages ─────────────────────────────────────────────────
      # enablement: true  → auto-enables GitHub Pages with source=Actions
      # if it has never been enabled for this repository.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ── 3. Ensure .nojekyll is present and verify artifact integrity ─────────
      # Prevents GitHub's Jekyll processor from ignoring files that start with
      # underscores or transforming HTML/JS/CSS.
      # Also verifies every CSS and JS file referenced by index.html is present
      # and that critical channel upload code is present.
      # FAILS the deployment if expected code is missing — never silently deploy old frontend.
      - name: Add .nojekyll and verify deployment artifact
        run: |
          touch frontend/.nojekyll

          echo "=== ARTIFACT ROOT: frontend/ ==="
          ls -la frontend/

          echo "=== CSS FILES ==="
          ls -la frontend/src/styles/

          echo "=== JS SERVICES ==="
          ls frontend/src/services/

          echo "=== JS PAGES ==="
          ls frontend/src/pages/

          echo "=== KEY FILE PRESENCE ==="
          for f in \
            frontend/index.html \
            frontend/sw.js \
            frontend/404.html \
            frontend/offline.html \
            frontend/manifest.json \
            frontend/src/styles/theme.css \
            frontend/src/styles/avenora-cosmic.css \
            frontend/src/styles/channel.css \
            frontend/src/styles/responsive.css \
            frontend/src/app.js \
            frontend/src/services/firebase.js \
            frontend/src/services/api.js \
            frontend/src/pages/hub.js \
            frontend/src/pages/channel.js \
            frontend/src/pages/channelstudio.js \
            frontend/src/pages/music.js \
            frontend/src/pages/social.js \
            frontend/icons/icon-192.png \
            frontend/icons/icon-512.png \
            frontend/live.html \
            frontend/live.css \
            frontend/live.js \
            frontend/live-hub.html \
            frontend/live-room.html; do
            if [ -f "$f" ]; then
              echo "  OK  $f"
            else
              echo "  MISSING  $f"
              exit 1
            fi
          done

          echo "=== SW VERSION ==="
          grep "const SW_VERSION\|const CACHE_NAME" frontend/sw.js

          echo "=== PRODUCTION VERSION CHECK ==="
          if grep -q "AVENORA_VERSION = '2026.09.20.1'" frontend/index.html; then
            echo "  OK  AVENORA_VERSION = 2026.09.20.1 found in index.html"
          else
            echo "  FAIL  AVENORA_VERSION not updated in index.html"
            exit 1
          fi

          echo "=== CHANNEL UPLOAD CODE VERIFICATION ==="
          if grep -q "/channel/programming/add" frontend/src/pages/channelstudio.js; then
            echo "  OK  /channel/programming/add found in channelstudio.js"
          else
            echo "  FAIL  /channel/programming/add missing from channelstudio.js — upload→channel wiring not deployed"
            exit 1
          fi
          if grep -q "chsMediaToProgramItem" frontend/src/pages/channelstudio.js; then
            echo "  OK  _chsMediaToProgramItem found in channelstudio.js"
          else
            echo "  FAIL  _chsMediaToProgramItem missing from channelstudio.js"
            exit 1
          fi
          if grep -q "chsDoAudioUpload\|chsDoVideoUpload" frontend/src/pages/channelstudio.js; then
            echo "  OK  upload handlers found in channelstudio.js"
          else
            echo "  FAIL  upload handlers missing from channelstudio.js"
            exit 1
          fi
          if grep -q "chs-upload-direct-row" frontend/src/pages/channelstudio.js; then
            echo "  OK  direct upload buttons found in channelstudio.js"
          else
            echo "  FAIL  direct upload buttons missing from channelstudio.js"
            exit 1
          fi
          if grep -q "SW_VERSION.*v29\|avenora-cache-v29" frontend/sw.js; then
            echo "  OK  SW v29 confirmed in sw.js"
          else
            echo "  FAIL  sw.js has not been bumped to v29"
            exit 1
          fi

          echo "=== DEAD REFERENCE CHECK ==="
          for bad in snx-gifts.css cohost.css cohost.js snx-gifts.js snx-net.js; do
            if grep -r --include="*.html" --include="*.js" --include="*.css" \
               "\"${bad}\"\|'${bad}'\|src=${bad}\|href=${bad}\|import.*${bad}" \
               frontend/ 2>/dev/null | grep -v "\.git"; then
              echo "  FOUND dead reference to: ${bad}"
              exit 1
            else
              echo "  CLEAN: no reference to ${bad}"
            fi
          done

          echo ""
          echo "=== ALL VERIFICATION CHECKS PASSED ==="

      # ── 4. Upload artifact ─────────────────────────────────────────────────
      # Packages frontend/ (the real AVENORA app) as the Pages artifact.
      # No build step required — this is a vanilla JS SPA.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      # ── 5. Deploy ──────────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── 6. Trigger Render backend redeploy (if hook URL is configured) ─────
      # Set RENDER_DEPLOY_HOOK_URL in GitHub → Settings → Secrets and variables
      # → Actions. Get the hook URL from Render Dashboard → your service →
      # Settings → Deploy Hook.
      # This step is a no-op if the secret is not set.
      - name: Trigger Render backend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render backend deploy..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "204" ]; then
            echo "  OK  Render deploy triggered (HTTP $RESPONSE)"
          else
            echo "  WARN  Render deploy hook returned HTTP $RESPONSE — check hook URL in GitHub secrets"
          fi
