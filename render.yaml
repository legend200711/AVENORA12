services:
  - type: web
    name: avenora-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FIREBASE_PROJECT_ID
        value: avenora-6e147
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyDnEEYamIVYfn7l6sPPS1Dp2fWJE34OXlI
      - key: FRONTEND_URL
        value: https://legend200711.github.io
      - key: FOUNDER_EMAIL
        value: christijerina46@gmail.com
      - key: SUPABASE_URL
        value: https://licuiqxkkfboqezzmsqu.supabase.co
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: LIVE_SESSION_TIMEOUT_SECONDS
        value: "3600"
      - key: CLOUD_STREAM_SHUFFLE
        value: "true"
      - key: CLOUD_STREAM_REPEAT
        value: "true"
      - key: CLOUD_STREAM_MEDIA_DIR
        value: ./media
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: MUSIC_MAX_FILE_MB
        value: "100"
      # ─── Secrets — set these in the Render dashboard, NEVER commit real values ───
      # MONGODB_URI              — MongoDB Atlas connection string
      #                            mongodb+srv://user:pass@cluster.mongodb.net/legend_universe
      #
      # JWT_SECRET               — Long random string (min 64 chars)
      #                            Generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      #
      # JWT_REFRESH_SECRET       — Different long random string (min 64 chars)
      #
      # SUPABASE_SERVICE_ROLE_KEY — From Supabase dashboard → Project Settings → API → service_role key
      #
      # SUPABASE_ANON_KEY        — From Supabase dashboard → Project Settings → API → anon public key
      #
      # RESEND_API_KEY           — From Resend dashboard → API Keys
      #                            Required for password reset emails. Without this, reset emails
      #                            will not be sent (the token is still stored; dev mode returns it in response).
      #
      # VAPID_PUBLIC_KEY         — Web Push VAPID public key
      #                            Generate: npx web-push generate-vapid-keys
      #
      # VAPID_PRIVATE_KEY        — Web Push VAPID private key (keep private)
      #
      # VAPID_SUBJECT            — mailto: address for VAPID, e.g. mailto:admin@legenduniverse.com
      #
      # MEDIAMTX_BASE_URL        — Base URL of your MediaMTX instance (required for live streaming)
      #                            e.g. https://media.example.com
      #
      # MEDIAMTX_WHIP_URL        — WHIP endpoint base for browser publishers
      #                            e.g. https://media.example.com/whip
      #
      # MEDIAMTX_HLS_URL         — HLS delivery base URL for viewers
      #                            e.g. https://media.example.com/hls
      #
      # MEDIAMTX_API_URL         — MediaMTX management API (internal, NOT exposed to frontend)
      #                            e.g. http://localhost:9997
      #
      # LIVE_PUBLIC_BASE_URL     — Public base URL for the AVENORA live feature
      #                            e.g. https://legend200711.github.io/AVENORA1
      #
      # CLOUD_STREAM_RTMP_TARGETS — Comma-separated RTMP ingest URL(s)
      #                            e.g. rtmp://a.rtmp.youtube.com/live2/YOUR_KEY
      #                            Leave blank to run in simulation mode (no actual broadcast).
